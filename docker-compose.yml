# Запуск: docker-compose up -d
# Все значения берутся из .env (шаблон — в .env.example).
services:
  postgres:
    image: postgres:16-alpine
    container_name: caloriebot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caloriebot}
      POSTGRES_USER: ${POSTGRES_USER:-caloriebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      # Все временные метки храню в UTC, «день» бота считаю в коде по UTC+3.
      TZ: UTC
      PGTZ: UTC
    volumes:
      # Именованный том — данные переживают пересоздание контейнера.
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Наружу отдаю порт только для отладки: в проде эту строку можно убрать.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caloriebot} -d ${POSTGRES_DB:-caloriebot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caloriebot-bot
    restart: unless-stopped
    depends_on:
      postgres:
        # Бот стартует только после того, как база реально готова принимать подключения.
        condition: service_healthy
    environment:
      Bot__Token: ${BOT_TOKEN:?Задайте BOT_TOKEN в .env}
      Bot__DropPendingUpdates: ${BOT_DROP_PENDING_UPDATES:-true}
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-caloriebot};Username=${POSTGRES_USER:-caloriebot};Password=${POSTGRES_PASSWORD}"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      TZ: UTC
    ports:
      - "${BOT_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Даю приложению догрести текущие апдейты перед остановкой.
    stop_grace_period: 30s

volumes:
  postgres-data:
    name: caloriebot-postgres-data
